<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ProSeal Construction</title>
<script>(function(){var c=navigator.connection||{},l=c.saveData||/(^|-)2g|^3g/.test(c.effectiveType||"");try{l=l||matchMedia("(prefers-reduced-data: reduce)").matches}catch(e){}if(l)document.documentElement.classList.add("lite")})()</script>
<script>(function(){var r=document.documentElement,p=location.pathname.split("/").pop();if(p&&p!=="index.html")return;if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;r.classList.add("opening");setTimeout(function(){if(!r.classList.contains("titled")){r.classList.remove("opening");r.classList.add("titled")}},9000)})()</script>
<!--page-head-->
</head>
<body>
<div id="root"><!--app--></div>
<script type="module" src="/src/main.tsx"></script>
</body>
